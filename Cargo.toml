[package]
name = "revinder-blog-be"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.103"
axum = { version = "0.8.9", features = ["macros"] }
axum-valid = { version = "0.25.0", default-features = false, features = [
	"garde",
	"basic",
] }
dotenvy = "0.15.7"
figment = { version = "0.10.19", features = ["env"] }
garde = { version = "0.23.0", features = ["derive", "email", "serde"] }
log = "0.4.33"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "migrate", "sqlite", "macros"] }
tokio = { version = "1.52.4", features = ["macros", "rt-multi-thread"] }
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["catch-panic", "timeout", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = [
	"registry",
	"env-filter",
] }
